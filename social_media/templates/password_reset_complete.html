{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="bg-[#2e2e2e] text-white">
  <!-- Navbar with Connectly Branding -->
  <nav class="navbar">
    <div class="container">
      <h2 class="text-white">Connectly</h2>
    </div>
  </nav>
  
  <!-- Main Content -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg" style="max-width: 400px;">
      <div class="card-body p-5">
        <h1 class="card-title text-center text-2xl font-bold mb-4">
          Password Reset Complete
        </h1>
        <p class="mb-3 text-center">
          Your password has been successfully reset. You may now log in with your new password.
        </p>
        <div class="text-center">
          <a href="{% url 'login' %}" class="btn btn-primary">
            Log In
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
