{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-md mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-white mb-6">Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="space-y-4">
        {{ add_form.as_p }}
        {{ user_form.as_p }}
      </div>
      <button type="submit" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
        Update Profile
      </button>
    </form>
  </div>
</div>
{% endblock content %}
